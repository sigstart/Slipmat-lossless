# Google's Widevine CDM, which plays the AAC of songs Apple has no lossless
# master for. It is Google's, not open source, and its licence forbids
# redistributing it, so it is fetched on request, never packaged, and never by
# `make install`: `make widevine` runs scripts/fetch-widevine.sh. The component
# comes from Google's own release server, the one Chrome's updater uses, and
# both it and the library inside it must match these SHA-256 digests.
#
# To bump: take the new component URL Chrome's updater offers for app id
# oimompecagnajdejgnnjijobebaeigek (the chromium-widevine AUR package records
# it), then regenerate both digests. Google revokes old versions, so a CDM that
# stops getting licences usually wants this.
