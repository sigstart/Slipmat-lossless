#     https://dl.google.com/android/repository/sys-img/android/sys-img2-1.xml).
#   libandroid, libdl, libOpenSLES are not Android's: they are built locally by
#     scripts/fairplay/android-stubs.sh and checked by their properties, so they
#     are not pinned here.
