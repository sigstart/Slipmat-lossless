#
# Also in the upstream rootfs, outside lib64, and deliberately not fetched:
# Slipmat loads Apple's libraries in-process through libhybris, whose own
# linker (vendor/libhybris/x86_64/q.so) replaces linker64, and runs with no tzdata (see
# vendor/adam/drm/drm_hybris.c). Recorded so a launcher that does need them
# can pin verified copies.
#   rootfs/system/bin/linker64: byte-identical to Google x86_64-21_r05 /bin/linker64.
# 85982b4aa9a0a5f24f8c1dca285ba08eb6a5dcdbb9820ac719a7e3c77aa4c737  linker64
#   rootfs/system/usr/share/zoneinfo/tzdata (WOL commit above): Android-format
#   compile of IANA tzdata2025c. All 597 zones have rules identical to zic output
#   from IANA's GPG-signed tzdata2025c.tar.gz (sha256 4aa79e4e...f957, signed by
#   Paul Eggert, key 7E3792A9D8ACF7D633BC1588ED97E90E62AA7E34), rearguard form,
#   zic -b fat. 395 zones are byte-identical; the other 202 differ only by an
#   encoding no-op at 2038-01-19 that older zic adds. Equivalent in rules to (but
#   not byte-identical with) AOSP's official 2025c file at platform/system/timezone
#   commit cbd571efcf6b551ba83a31147ec7a06182f8ec31 (tag android-17.0.0_r1),
#   output_data/iana/tzdata, sha256 bf87968a2297ebe2b43b03a08b7e1ff3d80562f49c0dd1414832ab9c9518ab5c
#   (gitiles serves it base64 via ?format=TEXT). Google's API 21 copy
#   (tzdata2014g) would be
#   39d912cc250447fddb069d7c19823a6db0050c8d93d85d438636be14795c6aea.
#   The silentone source above does not serve this file.
